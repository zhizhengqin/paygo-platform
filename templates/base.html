<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>太阳能即付即用系统 — 新华智科技</title>
  <link rel="stylesheet" href="/static/style.css">

</head>
<body>
  {% if request.url.path != '/login' %}
  <nav class="navbar">
    <div class="navbar-brand">
      <img src="/static/logo.png" alt="新华智科技" class="navbar-logo">
      <span class="navbar-title">新华智科技（柬埔寨）有限公司</span>
    </div>
    <div class="navbar-center">太阳能即付即用系统</div>
    <div class="navbar-right">
      <a href="/logout">退出</a>
    </div>
  </nav>
  {% endif %}
  {% if request.url.path != '/login' %}
  <nav class="nav-tabs">
    <a class="nav-tab active" data-tab="dashboard" onclick="switchTab('dashboard')">运营仪表盘</a>
    <a class="nav-tab" data-tab="customers" onclick="switchTab('customers')">客户管理</a>
    <a class="nav-tab" data-tab="contracts" onclick="switchTab('contracts')">合同管理</a>
    <a class="nav-tab" data-tab="tokens" onclick="switchTab('tokens')">Token 管理</a>
    <a class="nav-tab" data-tab="alerts" onclick="switchTab('alerts')">告警中心</a>
  </nav>
  {% endif %}
  {% block content %}{% endblock %}
</body>
</html>

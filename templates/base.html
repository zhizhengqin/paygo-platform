<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>太阳能即付即用系统 — 新华智科技</title>
  <link rel="stylesheet" href="/static/style.css">

</head>
<body>
  {% if request.url.path != '/login' %}
  <nav class="navbar">
    <div class="navbar-brand">
      <img src="/static/logo.png" alt="新华智科技" class="navbar-logo">
      <span class="navbar-title">新华智科技（柬埔寨）有限公司</span>
    </div>
    <div class="navbar-center">太阳能即付即用系统</div>
    <div class="navbar-right">
      <a href="#" onclick="if(typeof openController==='function'){openController();}else{location.href='/controller';}return false;" style="margin-right: 12px; color: #10b981; font-weight: 600; text-decoration: none;" title="点击打开浮动控制器面板">📱 设备模拟器</a>
      <a href="/help" style="margin-right: 12px; color: #3b82f6; font-weight: 600; text-decoration: none;" title="查看平台操作手册和演示流程">📖 平台说明书</a>
      <a href="/logout">退出</a>
    </div>
  </nav>
  {% endif %}
  {% if request.url.path != '/login' %}
  <div class="mobile-nav" style="position:relative;">
    <button class="hamburger-btn" onclick="toggleMobileMenu()" title="菜单">☰ 导航</button>
    <div class="nav-overlay" id="navOverlay" onclick="toggleMobileMenu()"></div>
    <nav class="nav-tabs" id="navTabs">
      <a class="nav-tab active" data-tab="dashboard" href="/dashboard" onclick="if(typeof switchTab==='function'){event.preventDefault();switchTab('dashboard');}">运营仪表盘</a>
      <a class="nav-tab" data-tab="customers" href="/dashboard" onclick="if(typeof switchTab==='function'){event.preventDefault();switchTab('customers');}">客户管理</a>
      <a class="nav-tab" data-tab="contracts" href="/dashboard" onclick="if(typeof switchTab==='function'){event.preventDefault();switchTab('contracts');}">合同管理</a>
      <a class="nav-tab" data-tab="tokens" href="/dashboard" onclick="if(typeof switchTab==='function'){event.preventDefault();switchTab('tokens');}">Token 管理</a>
      <a class="nav-tab" data-tab="alerts" href="/dashboard" onclick="if(typeof switchTab==='function'){event.preventDefault();switchTab('alerts');}">告警中心</a>
      <a class="nav-tab" data-tab="devicemap" href="/dashboard" onclick="if(typeof switchTab==='function'){event.preventDefault();switchTab('devicemap');}">设备地图</a>
      <a class="nav-tab" data-tab="reports" href="/dashboard" onclick="if(typeof switchTab==='function'){event.preventDefault();switchTab('reports');}">报表中心</a>
      <a class="nav-tab" data-tab="settings" href="/dashboard" onclick="if(typeof switchTab==='function'){event.preventDefault();switchTab('settings');}">系统设置</a>
    </nav>
  </div>
  <script>
  function toggleMobileMenu() {
    var tabs = document.getElementById('navTabs');
    var overlay = document.getElementById('navOverlay');
    tabs.classList.toggle('open');
    if (overlay) overlay.classList.toggle('show');
  }
  </script>
  {% endif %}
  {% block content %}{% endblock %}
</body>
</html>

{% extends "base.html" %}
{% block content %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<div class="main-layout">
  <!-- 左侧面板 -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h3 onclick="showDashboard()" style="cursor:pointer;">客户列表</h3>
      <span class="badge" id="customerCount">0</span>
      <button class="btn btn-primary btn-sm" onclick="showAddCustomerModal()">+ 新增</button>
    </div>
    <div class="customer-list" id="customerItems"></div>

    <!-- 密钥生成器 -->
    <div class="keygen-section">
      <div class="keygen-title">密钥生成器</div>
      <button class="keygen-btn" onclick="generateKeys()">生成 5 个设备密钥</button>
      <div class="keygen-list" id="keygenList"></div>
    </div>
  </aside>

  <!-- 右侧详情面板 -->
  <main class="detail-panel" id="detailPanel">
    <div class="empty-state">
      <div class="icon">☀</div>
      <p>选择左侧客户查看详情</p>
    </div>
  </main>
</div>

<!-- 新增客户弹窗 -->
<div class="modal-overlay" id="addCustomerModal">
  <div class="modal-card">
    <h3>新增客户</h3>
    <div class="form-group">
      <label>姓名</label>
      <input type="text" id="newName" placeholder="客户姓名">
    </div>
    <div class="form-group">
      <label>电话</label>
      <input type="text" id="newPhone" placeholder="联系电话">
    </div>
    <div class="form-group">
      <label>设备编号</label>
      <input type="text" id="newDevice" placeholder="如 SN-KH-001">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>设备密钥（32位hex）</label>
        <input type="text" id="newSecretKey" placeholder="设备出厂预设的32位hex密钥">
      </div>
      <button class="btn btn-outline btn-sm" onclick="fillRandomKey()" title="随机生成密钥">随机</button>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('addCustomerModal')">取消</button>
      <button class="btn btn-primary" onclick="createCustomer()">确认添加</button>
    </div>
  </div>
</div>

<!-- 模拟支付弹窗 -->
<div class="modal-overlay" id="simulatePaymentModal">
  <div class="modal-card">
    <h3>模拟支付</h3>
    <p style="color:#64748b;font-size:13px;margin-bottom:16px;text-align:center;" id="simulateCustomerName"></p>
    <div class="form-group">
      <label>支付金额</label>
      <select id="paymentAmount" style="width:100%;padding:10px 14px;border:1.5px solid #e2e8f0;border-radius:6px;font-size:14px;font-family:inherit;">
        <option value="5">$5.00 — 30天</option>
        <option value="10">$10.00 — 60天</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('simulatePaymentModal')">取消</button>
      <button class="btn btn-primary" onclick="simulatePayment()">确认支付</button>
    </div>
  </div>
</div>

<!-- Token + SMS 结果弹窗 -->
<div class="modal-overlay" id="tokenResultModal">
  <div class="modal-card" style="max-width:440px;">
    <h3 id="tokenResultTitle">激活码已生成</h3>
    <div class="token-display" id="tokenCode"></div>
    <div class="sms-preview">
      <div class="sms-label">模拟短信发送</div>
      <div style="font-size:12px;color:#475569;margin-bottom:6px;">收件人: <strong id="smsTo"></strong></div>
      <div class="sms-content" id="smsBody"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="closeModal('tokenResultModal');selectCustomer(selectedCustomerId);">完成</button>
    </div>
  </div>
</div>

<!-- 确认弹窗 -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal-card">
    <h3 id="confirmTitle">确认操作</h3>
    <p style="color:#64748b;font-size:14px;margin-bottom:20px;text-align:center;" id="confirmMessage"></p>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('confirmModal')">取消</button>
      <button class="btn btn-danger" id="confirmBtn" onclick="">确认</button>
    </div>
  </div>
</div>

<!-- 删除确认弹窗 -->
<div class="modal-overlay" id="deleteConfirmModal">
  <div class="modal-card">
    <h3>确认删除</h3>
    <p style="color:#64748b;font-size:14px;margin-bottom:20px;text-align:center;">
      确定要删除客户 <strong id="deleteCustomerName"></strong> 吗？此操作不可撤销。
    </p>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('deleteConfirmModal')">取消</button>
      <button class="btn btn-danger" onclick="confirmDelete()">确认删除</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ---- Tab 切换 ----
function switchTab(tab) {
  document.querySelectorAll('.nav-tab').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === tab);
  });
  const layout = document.querySelector('.main-layout');
  if (tab === 'dashboard') {
    layout.classList.add('sidebar-hidden');
    showDashboard();
  } else if (tab === 'customers') {
    layout.classList.remove('sidebar-hidden');
    selectedCustomerId = null;
    // 还原侧边栏为客户列表模式
    document.querySelector('.sidebar-header h3').textContent = '客户列表';
    document.querySelector('.sidebar-header h3').onclick = function() { showDashboard(); };
    const keygenSection = document.querySelector('.keygen-section');
    if (keygenSection) {
      keygenSection.innerHTML = `
        <div class="keygen-title">客户筛选</div>
        <div style="padding:8px 12px;">
          <input type="text" id="customerSearch" placeholder="搜索姓名/电话..." 
            style="width:100%;padding:6px 10px;border:1px solid var(--border);border-radius:4px;font-size:12px;margin-bottom:6px;font-family:inherit;"
            oninput="searchCustomers()">
        </div>
        <div class="keygen-title" style="margin-top:8px;">密钥生成器</div>
        <button class="keygen-btn" onclick="generateKeys()">生成 5 个设备密钥</button>
        <div class="keygen-list" id="keygenList"></div>
      `;
    }
    loadCustomers();
    document.getElementById('detailPanel').innerHTML = `
      <div class="empty-state">
        <div class="icon">☀</div>
        <p>选择左侧客户查看详情</p>
      </div>
    `;
  } else if (tab === 'contracts') {
    layout.classList.remove('sidebar-hidden');
    selectedCustomerId = null;
    selectedContractId = null;
    loadContracts();
  } else if (tab === 'tokens') {
    layout.classList.remove('sidebar-hidden');
    selectedCustomerId = null;
    selectedContractId = null;
    selectedTokenId = null;
    loadTokens();
  } else if (tab === 'alerts') {
    layout.classList.remove('sidebar-hidden');
    selectedCustomerId = null;
    selectedContractId = null;
    selectedTokenId = null;
    loadAlerts();
  }
}

let selectedCustomerId = null;
let deleteTargetId = null;

const STATUS_MAP = {
  active: '活跃',
  locked: '已锁定',
  permanent: '永久解锁',
};
const STATUS_CLASS = {
  active: 'status-active',
  locked: 'status-locked',
  permanent: 'status-permanent',
};
const STATUS_DOT = {
  active: '🟢',
  locked: '🔴',
  permanent: '⭐',
};

// ---- Toast ----
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ---- 密钥生成 ----
async function generateKeys() {
  const resp = await fetch('/api/utils/generate-secret-keys?count=5');
  const data = await resp.json();
  const list = document.getElementById('keygenList');
  list.innerHTML = data.secret_keys.map((k, i) => `
    <div class="keygen-item">
      <span>${i+1}. ${k}</span>
      <button class="keygen-copy" onclick="copyKey('${k}', this)">复制</button>
    </div>
  `).join('');
}

async function fillRandomKey() {
  const resp = await fetch('/api/utils/generate-secret-key');
  const data = await resp.json();
  document.getElementById('newSecretKey').value = data.secret_key;
}

function copyKey(key, btn) {
  navigator.clipboard.writeText(key).then(() => {
    btn.textContent = '已复制';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 1500);
  }).catch(() => { showToast('复制失败，请手动选择'); });
}

// ---- 仪表盘首页 (增强版) ----
async function showDashboard() {
  selectedCustomerId = null;
  await loadCustomers();

  var days = 30;
  var resp = await fetch('/api/dashboard/enhanced-stats?days=' + days);
  if (!resp.ok) {
    document.getElementById('detailPanel').innerHTML = '<div class="empty-state"><p>加载失败</p></div>';
    return;
  }
  var stats = await resp.json();
  var k = stats.kpi;

  document.getElementById('detailPanel').innerHTML = `
    <div id="dashboardHome">
      <div class="dash-header">
        <h2>运营仪表盘</h2>
        <div style="display:flex;align-items:center;gap:8px;">
          <select id="mfiFilter" onchange="showDashboard()" style="padding:4px 8px;border:1px solid var(--border);border-radius:4px;font-size:12px;font-family:inherit;">
            <option value="">全部 MFI</option>
          </select>
          <div class="btn-group" style="margin:0;">
            <button class="btn btn-outline btn-sm" onclick="showDashboardWithDays(7)">7天</button>
            <button class="btn btn-outline btn-sm" onclick="showDashboardWithDays(30)" style="background:#059669;color:#fff;">30天</button>
            <button class="btn btn-outline btn-sm" onclick="showDashboardWithDays(90)">90天</button>
          </div>
        </div>
      </div>

      <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr);">
        <div class="kpi-card kpi-blue" onclick="switchTab('customers')">
          <div class="kpi-value">${k.total_customers}</div><div class="kpi-label">总客户数</div>
        </div>
        <div class="kpi-card kpi-green" onclick="switchTab('customers')">
          <div class="kpi-value">${k.active_devices}</div><div class="kpi-label">活跃设备</div>
        </div>
        <div class="kpi-card kpi-gold">
          <div class="kpi-value">$${k.monthly_revenue.toFixed(0)}</div><div class="kpi-label">本月收入 (USD)</div>
        </div>
        <div class="kpi-card kpi-red" onclick="switchTab('alerts')">
          <div class="kpi-value">${k.locked_devices}</div><div class="kpi-label">逾期锁定 (${k.overdue_rate}%)</div>
        </div>
        <div class="kpi-card" style="border-left:4px solid #3b82f6;">
          <div class="kpi-value">${k.token_month}</div><div class="kpi-label">本月 Token 生成</div>
        </div>
        <div class="kpi-card" style="border-left:4px solid #8b5cf6;">
          <div class="kpi-value">${k.contracts_active}</div><div class="kpi-label">执行中合同</div>
        </div>
        <div class="kpi-card" style="border-left:4px solid #dc2626;">
          <div class="kpi-value">${k.alert_pending}</div><div class="kpi-label" onclick="switchTab('alerts')" style="cursor:pointer;">待处理告警</div>
        </div>
        <div class="kpi-card" style="border-left:4px solid #059669;">
          <div class="kpi-value">${k.overdue_rate}%</div><div class="kpi-label">逾期率</div>
        </div>
      </div>

      <div class="dash-grid">
        <div class="dash-chart-box"><h4>收入趋势 (近${days}天)</h4><div class="chart-wrap"><div id="revenueChart" style="height:250px;"></div></div></div>
        <div class="dash-chart-box"><h4>Token 生成趋势</h4><div class="chart-wrap"><div id="tokenChart" style="height:250px;"></div></div></div>
      </div>

      <div class="dash-grid">
        <div class="dash-chart-box"><h4>告警级别分布</h4><div class="chart-wrap"><div id="alertLevelChart" style="height:200px;"></div></div></div>
        <div class="dash-chart-box"><h4>近7天告警趋势</h4><div class="chart-wrap"><div id="alertTrendChart" style="height:200px;"></div></div></div>
      </div>

      <div class="dash-grid">
        <div class="dash-chart-box"><h4>设备状态分布</h4><div class="chart-wrap"><div id="deviceStatusChart" style="height:200px;"></div></div></div>
        <div class="dash-table-box">
          <h4>最近交易</h4>
          <table class="tx-table"><thead><tr><th>时间</th><th>客户</th><th>金额</th><th>天数</th></tr></thead><tbody id="txTableBody"></tbody></table>
        </div>
      </div>
    </div>
  `;

  // Load MFI filter
  try {
    var mfisResp = await fetch('/api/mfis');
    var mfis = await mfisResp.json();
    var sel = document.getElementById('mfiFilter');
    mfis.forEach(function(m) { sel.innerHTML += '<option value="' + m.id + '">' + escapeHtml(m.name) + '</option>'; });
  } catch(e) {}

  // Render charts using ECharts
  renderRevenueChart(stats.revenue_trend);
  renderTokenChart(stats.token_trend);
  renderAlertLevelChart(stats.alert_by_level);
  renderAlertTrendChart(stats.alert_trend);
  renderDeviceStatusChart(k);
  renderTxTable();
}

function showDashboardWithDays(d) {
  document.querySelectorAll('#dashboardHome .btn-group .btn-sm').forEach(function(b,i) {
    b.style.background = (i===0&&d===7)||(i===1&&d===30)||(i===2&&d===90) ? '#059669' : '';
    b.style.color = (i===0&&d===7)||(i===1&&d===30)||(i===2&&d===90) ? '#fff' : '';
  });
  showDashboard();
}

function renderRevenueChart(data) {
  var el = document.getElementById('revenueChart'); if (!el) return;
  var chart = echarts.init(el);
  chart.setOption({
    tooltip: {trigger:'axis'},
    grid: {left:50,right:20,top:20,bottom:30},
    xAxis: {type:'category',data:data.map(function(d){return d.date;}),axisLabel:{fontSize:10,rotate:45}},
    yAxis: {type:'value',axisLabel:{fontSize:10}},
    series: [{type:'line',data:data.map(function(d){return d.amount;}),smooth:true,
      lineStyle:{color:'#059669'},itemStyle:{color:'#059669'},areaStyle:{color:'rgba(5,150,105,0.1)'}}]
  });
}

function renderTokenChart(data) {
  var el = document.getElementById('tokenChart'); if (!el) return;
  var chart = echarts.init(el);
  chart.setOption({
    tooltip: {trigger:'axis'},
    grid: {left:50,right:20,top:20,bottom:30},
    xAxis: {type:'category',data:data.map(function(d){return d.date;}),axisLabel:{fontSize:10,rotate:45}},
    yAxis: {type:'value',axisLabel:{fontSize:10}},
    series: [{type:'bar',data:data.map(function(d){return d.count;}),
      itemStyle:{color:'#3b82f6',borderRadius:[4,4,0,0]}}]
  });
}

function renderAlertLevelChart(data) {
  var el = document.getElementById('alertLevelChart'); if (!el) return;
  var chart = echarts.init(el);
  chart.setOption({
    tooltip: {trigger:'item'},
    series: [{type:'pie',radius:['40%','70%'],
      data:[{value:data.P0,name:'P0',itemStyle:{color:'#dc2626'}},
            {value:data.P1,name:'P1',itemStyle:{color:'#f59e0b'}},
            {value:data.P2,name:'P2',itemStyle:{color:'#3b82f6'}}],
      label:{formatter:'{b}: {c}'}}]
  });
}

function renderAlertTrendChart(data) {
  var el = document.getElementById('alertTrendChart'); if (!el) return;
  var chart = echarts.init(el);
  chart.setOption({
    tooltip: {trigger:'axis'},
    grid: {left:40,right:20,top:20,bottom:30},
    xAxis: {type:'category',data:data.map(function(d){return d.date;}),axisLabel:{fontSize:10}},
    yAxis: {type:'value',axisLabel:{fontSize:10}},
    series: [{type:'line',data:data.map(function(d){return d.count;}),
      lineStyle:{color:'#dc2626'},itemStyle:{color:'#dc2626'},areaStyle:{color:'rgba(220,38,38,0.08)'}}]
  });
}

function renderDeviceStatusChart(k) {
  var el = document.getElementById('deviceStatusChart'); if (!el) return;
  var chart = echarts.init(el);
  chart.setOption({
    tooltip: {trigger:'item'},
    series: [{type:'pie',radius:'60%',
      data:[{value:k.active_devices,name:'活跃',itemStyle:{color:'#059669'}},
            {value:k.locked_devices,name:'逾期锁定',itemStyle:{color:'#dc2626'}},
            {value:k.permanent_devices,name:'永久解锁',itemStyle:{color:'#f59e0b'}}],
      label:{formatter:'{b}: {c}'}}]
  });
}

async function renderTxTable() {
  var resp = await fetch('/api/dashboard/stats');
  var stats = await resp.json();
  var tbody = document.getElementById('txTableBody');
  if (!tbody) return;
  var txs = stats.recent_transactions || [];
  if (txs.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#94a3b8;padding:24px;">暂无交易</td></tr>';
    return;
  }
  tbody.innerHTML = txs.map(function(t) {
    return '<tr><td>'+(t.generated_at||'-')+'</td><td>'+escapeHtml(t.customer_name)+'</td><td>$'+t.amount.toFixed(2)+'</td><td>'+(t.days===-1?'永久':t.days+'天')+'</td></tr>';
  }).join('');
}

// ---- 客户列表 ----
async function loadCustomers() {
  const resp = await fetch('/api/customers');
  const customers = await resp.json();
  renderCustomerList(customers);
  document.getElementById('customerCount').textContent = customers.length;
}

// ---- 客户详情 (360视图) ----
async function selectCustomer(id) {
  selectedCustomerId = id;
  document.querySelectorAll('.nav-tab').forEach(function(el) {
    el.classList.toggle('active', el.dataset.tab === 'customers');
  });
  document.querySelector('.main-layout').classList.remove('sidebar-hidden');
  await loadCustomers();

  const resp = await fetch('/api/customers/' + encodeURIComponent(id) + '/360');
  const view = await resp.json();
  const c = view.customer;

  const initials = c.name.charAt(0);
  const statusLabel = STATUS_MAP[c.status] || c.status;
  const statusClass = STATUS_CLASS[c.status] || '';
  const statusDot = STATUS_DOT[c.status] || '';

  const contractsHtml = view.contracts && view.contracts.length > 0
    ? view.contracts.map(function(ct) {
        return '<div class="customer-item" onclick="switchTab(\'contracts\');selectContract(\'' + ct.id + '\')" style="cursor:pointer;margin:3px 0;padding:8px 12px;">' +
          '<span style="font-weight:500;">' + escapeHtml(ct.contract_no) + '</span>' +
          '<span style="float:right;color:#64748b;font-size:12px;">' + ct.status + ' · $' + ct.loan_amount.toFixed(0) + '</span></div>';
      }).join('')
    : '<p style="color:#94a3b8;font-size:12px;padding:8px;">暂无合同</p>';

  const tokensHtml = view.tokens && view.tokens.length > 0
    ? '<div style="border-left:2px solid #e2e8f0;padding-left:12px;">' +
      view.tokens.slice(0,15).map(function(t) {
        var dot = t.status === 'SUPERSEDED' ? '🔴' : t.status === 'USED' ? '🟢' : '⚪';
        return '<div style="margin:4px 0;font-size:12px;line-height:1.6;">' +
          dot + ' <code style="background:#f1f5f9;padding:1px 4px;border-radius:2px;font-size:11px;">' + t.token + '</code>' +
          ' <span style="color:#64748b;">' + (t.days === -1 ? '永久' : t.days+'天') + '</span>' +
          ' <span style="color:#94a3b8;">' + (t.generated_at || '') + '</span></div>';
      }).join('') + '</div>'
    : '<p style="color:#94a3b8;font-size:12px;padding:8px;">暂无 Token</p>';

  var tagsHtml = '';
  if (c.tags && c.tags.length > 0) {
    tagsHtml = c.tags.map(function(t) {
      return '<span class="tag-chip" style="display:inline-block;background:#e0f2fe;color:#0369a1;padding:2px 8px;border-radius:12px;font-size:11px;margin:2px;">' + escapeHtml(t) + ' <a href="#" onclick="removeTag(\'' + c.id + '\',\'' + t + '\');return false;" style="color:#dc2626;text-decoration:none;">×</a></span>';
    }).join('');
  } else {
    tagsHtml = '<span style="color:#94a3b8;font-size:12px;">暂无标签</span>';
  }

  document.getElementById('detailPanel').innerHTML = `
    <div class="detail-card">
      <div class="detail-header">
        <div class="detail-avatar">${initials}</div>
        <div>
          <h2>${escapeHtml(c.name)}</h2>
          <span class="status-badge ${statusClass}">${statusDot} ${statusLabel}</span>
          ${c.tags && c.tags.length > 0 ? ' ' + c.tags.map(function(t) { return '<span style="background:#e0f2fe;color:#0369a1;padding:1px 6px;border-radius:8px;font-size:10px;">' + escapeHtml(t) + '</span>'; }).join(' ') : ''}
        </div>
      </div>

      <div class="detail-body">
        <div class="detail-row"><span class="label">电话</span><span class="value">${c.phone}</span></div>
        <div class="detail-row"><span class="label">设备编号</span><span class="value">${c.device_id}</span></div>
        <div class="detail-row"><span class="label">设备密钥</span><span class="value-mono">${(c.secret_key||'').substring(0,12)}…</span></div>
        <div class="detail-row"><span class="label">Token 计数</span><span class="value">${c.count}</span></div>
        ${c.address ? '<div class="detail-row"><span class="label">地址</span><span class="value">' + escapeHtml(c.address) + '</span></div>' : ''}
        ${c.id_number ? '<div class="detail-row"><span class="label">身份证</span><span class="value">' + escapeHtml(c.id_number) + '</span></div>' : ''}
        ${c.gps_latitude ? '<div class="detail-row"><span class="label">GPS</span><span class="value">' + c.gps_latitude + ', ' + c.gps_longitude + '</span></div>' : ''}
        ${view.mfi_name ? '<div class="detail-row"><span class="label">MFI</span><span class="value">' + escapeHtml(view.mfi_name) + '</span></div>' : ''}
        <div class="detail-row"><span class="label">创建日期</span><span class="value">${c.created_at}</span></div>
      </div>

      <div class="detail-section">

function showAddCustomerModal() {

  document.getElementById('newPhone').value = '';
  document.getElementById('newDevice').value = '';
  document.getElementById('newSecretKey').value = '';

async function createCustomer() {
  const name = document.getElementById('newName').value.trim();
  const phone = document.getElementById('newPhone').value.trim();
  const device_id = document.getElementById('newDevice').value.trim();
  const secret_key = document.getElementById('newSecretKey').value.trim();
  if (!name || !phone || !device_id || !secret_key) { alert('请填写所有字段'); return; }
  if (secret_key.length !== 32) { alert('设备密钥必须为32位hex字符串'); return; }
  const resp = await fetch('/api/customers', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name, phone, device_id, secret_key})
  });
  if (!resp.ok) {
    const err = await resp.json();
    alert('创建失败: ' + (err.detail || resp.statusText));
    return;
  }
  closeModal('addCustomerModal');
  await loadCustomers();
}

    <div class="customer-item ${c.id === selectedContractId ? 'active' : ''}"
         onclick="selectContract('${c.id}')">

async function selectContract(cid) {
  selectedContractId = cid;
  await loadContracts();
  const resp = await fetch('/api/contracts/' + encodeURIComponent(cid));
  const c = await resp.json();

  const STATUS_LABEL = {
    draft: '草稿', approved: '已审批', active: '执行中',
    overdue: '逾期', closed: '已结清', recovered: '已回收',
  };

  const paidCount = c.schedules ? c.schedules.filter(function(s) { return s.status === 'paid'; }).length : 0;
  const totalCount = c.schedules ? c.schedules.length : 0;
  const progressPct = totalCount > 0 ? Math.round(paidCount / totalCount * 100) : 0;

  // 待还期数（取前3个用于快捷还款按钮）
  const pendingSchedules = c.schedules ? c.schedules.filter(function(s) { return s.status === 'pending'; }) : [];

  document.getElementById('detailPanel').innerHTML = `
    <div class="detail-card">
      <div class="detail-header">
        <div class="detail-avatar">${c.contract_no ? c.contract_no[3] : 'C'}</div>
        <div>
          <h2>${escapeHtml(c.contract_no)}</h2>
          <span class="status-badge">${STATUS_LABEL[c.status] || c.status}</span>
        </div>
      </div>
      <div class="detail-body">
        <div class="detail-row"><span class="label">客户</span><span class="value">${escapeHtml(c.customer_name || '—')}</span></div>
        <div class="detail-row"><span class="label">贷款金额</span><span class="value">$${c.loan_amount.toFixed(2)}</span></div>
        <div class="detail-row"><span class="label">月供</span><span class="value">$${c.monthly_payment.toFixed(2)}</span></div>
        <div class="detail-row"><span class="label">首付</span><span class="value">$${c.down_payment.toFixed(2)}</span></div>
        <div class="detail-row"><span class="label">合同期限</span><span class="value">${c.start_date || '—'} ~ ${c.end_date || '—'}</span></div>
        <div class="detail-row"><span class="label">剩余天数</span><span class="value">${c.remaining_days || 0} 天</span></div>
      </div>

      ${totalCount > 0 ? `
      <div class="detail-section">
        <h4>还款进度 ${paidCount}/${totalCount} 期</h4>
        <div style="background:#e2e8f0;border-radius:8px;height:24px;overflow:hidden;margin:8px 0;">
          <div style="width:${progressPct}%;height:100%;background:linear-gradient(90deg,#059669,#10b981);border-radius:8px;transition:width 0.4s;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;">
            ${progressPct > 10 ? progressPct + '%' : ''}
          </div>
        </div>
        <span style="font-size:12px;color:#64748b;">${progressPct}% 已完成</span>
      </div>
      ` : ''}

      ${c.status === 'active' && pendingSchedules.length > 0 ? `
      <div class="detail-section">
        <h4>模拟还款</h4>
        <p style="color:#94a3b8;font-size:12px;margin-bottom:10px;">选择待还期数进行模拟还款（将生成 ADD_TIME Token）</p>
        <div class="btn-group" style="flex-wrap:wrap;">
          ${pendingSchedules.slice(0,3).map(function(s) {
            return '<button class="btn btn-primary btn-sm" onclick="paySchedule(\'' + c.id + '\',\'' + s.id + '\',' + s.total.toFixed(2) + ')">第' + s.period_no + '期 · $' + s.total.toFixed(2) + ' · ' + s.due_date + '</button>';
          }).join('')}
        </div>
      </div>
      ` : ''}

      <div class="detail-section">
        <h4>操作</h4>
        <div class="btn-group" style="flex-wrap:wrap;">
          ${c.status === 'draft' ? '<button class="btn btn-primary btn-sm" onclick="approveContract(\'' + c.id + '\')">审批通过</button>' : ''}
          ${(c.status === 'active' || c.status === 'overdue') ? '<button class="btn btn-success btn-sm" onclick="settleContract(\'' + c.id + '\')">提前结清</button>' : ''}
          ${c.status === 'active' ? '<button class="btn btn-warning btn-sm" onclick="markOverdue(\'' + c.id + '\')">标记逾期</button>' : ''}
          ${c.status === 'overdue' ? '<button class="btn btn-primary btn-sm" onclick="markActive(\'' + c.id + '\')">恢复活跃</button>' : ''}
          ${(c.status === 'active' || c.status === 'overdue') ? '<button class="btn btn-danger btn-sm" onclick="closeContract(\'' + c.id + '\')">结清/回收</button>' : ''}
        </div>
        <button class="btn btn-outline btn-sm" style="margin-top:8px;" onclick="checkOverdue()">检测逾期</button>
      </div>

      ${c.schedules && c.schedules.length > 0 ? `
      <div class="detail-section">
        <h4>还款计划表</h4>
        <div style="overflow-x:auto;">
          <table class="tx-table">
            <thead><tr><th>期数</th><th>应还日</th><th>月供</th><th>本金</th><th>利息</th><th>剩余本金</th><th>状态</th></tr></thead>
            <tbody>
              ${c.schedules.map(function(s) { return '<tr><td>' + s.period_no + '</td><td>' + s.due_date + '</td><td>$' + s.total.toFixed(2) + '</td><td>$' + s.principal.toFixed(2) + '</td><td>$' + s.interest.toFixed(2) + '</td><td>$' + s.balance.toFixed(2) + '</td><td>' + (s.status === 'paid' ? '已付' : s.status === 'overdue' ? '逾期' : '待还') + '</td></tr>'; }).join('')}
            </tbody>
          </table>
        </div>
      </div>
      ` : ''}
    </div>
  `;
}

async function markOverdue(cid) {
  await fetch('/api/contracts/' + encodeURIComponent(cid) + '/status', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({status: 'overdue'})
  });
  selectContract(cid);
  showToast('合同已标记为逾期');
}

async function markActive(cid) {
  await fetch('/api/contracts/' + encodeURIComponent(cid) + '/status', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({status: 'active'})
  });

}

async function closeContract(cid) {
  const status = confirm('选「确定」结清合同，选「取消」标记为设备回收') ? 'closed' : 'recovered';
  await fetch('/api/contracts/' + encodeURIComponent(cid) + '/status', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({status: status})
  });
  selectContract(cid);
  showToast(status === 'closed' ? '合同已结清' : '合同已标记为设备回收');
}

async function paySchedule(contractId, scheduleId, amount) {
  const resp = await fetch('/api/contracts/' + encodeURIComponent(contractId) + '/pay', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({schedule_id: scheduleId, amount: amount})
  });
  if (!resp.ok) {
    const err = await resp.json();
    showToast('还款失败: ' + (err.detail || ''));
    return;
  }
  const data = await resp.json();
  document.getElementById('tokenResultTitle').textContent = '还款成功 - 激活码已生成';
  document.getElementById('tokenCode').textContent = data.token;
  document.getElementById('smsTo').textContent = 'SIMULATED';
  document.getElementById('smsBody').textContent =
    '[PAYGO Solar] 您已成功还款 $' + amount.toFixed(2) + '。激活码：' + data.token + '。有效期30天。请尽快输入您的设备。';
  document.getElementById('tokenResultModal').classList.add('show');
  // 延迟刷新合同详情以显示更新后的还款进度
  setTimeout(function() { selectContract(contractId); }, 500);
}

async function settleContract(contractId) {
  if (!confirm('确定要结清此合同吗？将生成永久解锁码（DISABLE_PAYG），此操作不可撤销。')) return;
  const resp = await fetch('/api/contracts/' + encodeURIComponent(contractId) + '/settle', {
    method: 'POST'
  });
  if (!resp.ok) {
    const err = await resp.json();
    showToast('结清失败: ' + (err.detail || ''));
    return;
  }
  const data = await resp.json();
  document.getElementById('tokenResultTitle').textContent = '合同已结清 - 永久解锁码';
  document.getElementById('tokenCode').textContent = data.token;
  document.getElementById('smsTo').textContent = data.sms.to;
  document.getElementById('smsBody').textContent = data.sms.message;
  document.getElementById('tokenResultModal').classList.add('show');
  setTimeout(function() { selectContract(contractId); }, 500);
}

// ---- 标签管理 ----
async function addTag(cid) {
  var tag = prompt('输入标签名（如：VIP、高风险、投诉频繁、新客户）：');
  if (!tag) return;
  var resp = await fetch('/api/customers/' + encodeURIComponent(cid) + '/360');
  var view = await resp.json();
  var currentTags = view.customer.tags || [];
  if (currentTags.indexOf(tag) >= 0) { showToast('标签已存在'); return; }
  var newTags = currentTags.concat([tag]);
  await fetch('/api/customers/' + encodeURIComponent(cid) + '/tags', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({tags: newTags})
  });
  selectCustomer(cid);
}

async function removeTag(cid, tag) {
  var resp = await fetch('/api/customers/' + encodeURIComponent(cid) + '/360');
  var view = await resp.json();
  var newTags = (view.customer.tags || []).filter(function(t) { return t !== tag; });
  await fetch('/api/customers/' + encodeURIComponent(cid) + '/tags', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({tags: newTags})
  });
  selectCustomer(cid);
}

var customerSearchTimeout = null;
async function searchCustomers() {
  clearTimeout(customerSearchTimeout);
  customerSearchTimeout = setTimeout(async function() {
    var q = document.getElementById('customerSearch').value.trim();
    var url = q ? '/api/customers?search=' + encodeURIComponent(q) : '/api/customers';

    renderCustomerList(customers);

function renderCustomerList(customers) {
  var container = document.getElementById('customerItems');
  document.getElementById('customerCount').textContent = customers.length;
  if (customers.length === 0) {
    container.innerHTML = '<p style="color:#94a3b8;font-size:13px;text-align:center;padding:20px;">无匹配客户</p>';
    return;
  }
  container.innerHTML = customers.map(function(c) {
    var tagStr = c.tags && c.tags.length > 0 ? ' · ' + c.tags.join(',') : '';
    return '<div class="customer-item ' + (c.id === selectedCustomerId ? 'active' : '') + '" onclick="selectCustomer(\'' + c.id + '\')">' +
      '<div class="name">' + (STATUS_DOT[c.status] || '⚪') + ' ' + escapeHtml(c.name) + '<span style="font-size:10px;color:#94a3b8;">' + tagStr + '</span></div>' +
      '<div class="meta">' + c.phone + ' · ' + c.device_id + '</div></div>';
  }).join('');
}

let selectedTokenId = null;

async function loadTokens() {
  const statsResp = await fetch('/api/tokens/stats');
  const stats = await statsResp.json();

  const tokensResp = await fetch('/api/tokens?limit=100');
  const tokens = await tokensResp.json();

  const container = document.getElementById('customerItems');
  document.querySelector('.sidebar-header h3').textContent = 'Token 列表';
  document.querySelector('.sidebar-header h3').onclick = null;
  document.getElementById('customerCount').textContent = tokens.length;

  const keygenSection = document.querySelector('.keygen-section');
  if (keygenSection) {
    keygenSection.innerHTML = `
      <div class="keygen-title">Token 统计</div>
      <div style="padding:8px 12px;font-size:12px;color:#475569;line-height:1.6;">
        <div>总数: <strong>${stats.total}</strong> · 今日: <strong>${stats.today}</strong></div>
        <div>本月: <strong>${stats.this_month}</strong> · 已作废: <strong>${stats.superseded}</strong></div>
      </div>
    `;
  }

  const STATUS_DOT_T = { 'UNUSED':'⚪', 'USED':'🟢', 'SUPERSEDED':'🔴' };

  container.innerHTML = tokens.map(function(t) {
    return '<div class="customer-item ' + (t.id === selectedTokenId ? 'active' : '') + '" onclick="selectToken(\'' + t.id + '\')">' +
      '<div class="name">' + (STATUS_DOT_T[t.status] || '⚪') + ' ' + t.token + '</div>' +
      '<div class="meta">' + escapeHtml(t.customer_id || '—') + ' · ' + t.days + '天 · ' + (t.status || 'UNUSED') + '</div>' +
      '</div>';
  }).join('');

  if (!selectedTokenId) {
    document.getElementById('detailPanel').innerHTML = '<div class="empty-state"><div class="icon">🔑</div><p>选择左侧 Token 查看详情</p></div>';
  }
}

async function selectToken(tid) {
  selectedTokenId = tid;
  document.querySelectorAll('.nav-tab').forEach(function(el) {
    el.classList.toggle('active', el.dataset.tab === 'tokens');
  });
  document.querySelector('.main-layout').classList.remove('sidebar-hidden');
  await loadTokens();

  const resp = await fetch('/api/tokens/' + encodeURIComponent(tid));
  const t = await resp.json();

  const STATUS_LABEL_T = { 'UNUSED':'未使用', 'USED':'已使用', 'SUPERSEDED':'已作废' };

  document.getElementById('detailPanel').innerHTML = `
    <div class="detail-card">
      <div class="detail-header">
        <div class="detail-avatar">T</div>
        <div>
          <h2>${t.token}</h2>
          <span class="status-badge">${STATUS_LABEL_T[t.status] || t.status}</span>
        </div>
      </div>
      <div class="detail-body">
        <div class="detail-row"><span class="label">Token 值</span><span class="value-mono">${t.token}</span></div>
        <div class="detail-row"><span class="label">类型</span><span class="value">${t.days === -1 ? 'DISABLE_PAYG (永久解锁)' : 'ADD_TIME (' + t.days + '天)'}</span></div>
        <div class="detail-row"><span class="label">客户</span><span class="value">${escapeHtml(t.customer_name || '—')} (${t.customer_id})</span></div>
        <div class="detail-row"><span class="label">金额</span><span class="value">$${t.amount.toFixed(2)}</span></div>
        <div class="detail-row"><span class="label">Counter</span><span class="value">${t.count}</span></div>
        <div class="detail-row"><span class="label">生成时间</span><span class="value">${t.generated_at || '—'}</span></div>
        <div class="detail-row"><span class="label">过期时间</span><span class="value">${t.expires_at || '—'}</span></div>
        ${t.contract_id ? '<div class="detail-row"><span class="label">关联合同</span><span class="value">' + t.contract_id + '</span></div>' : ''}
        ${t.status === 'SUPERSEDED' ? '<div class="detail-row"><span class="label">作废操作人</span><span class="value">' + escapeHtml(t.voided_by || '—') + '</span></div>' : ''}
        ${t.status === 'SUPERSEDED' ? '<div class="detail-row"><span class="label">作废原因</span><span class="value">' + escapeHtml(t.void_reason || '—') + '</span></div>' : ''}
        ${t.superseded_by ? '<div class="detail-row"><span class="label">替换 Token ID</span><span class="value">' + t.superseded_by + '</span></div>' : ''}
      </div>
      <div class="detail-section">
        <h4>操作</h4>
        <div class="btn-group">
          ${t.status !== 'SUPERSEDED' ? '<button class="btn btn-warning btn-sm" onclick="doVoidToken(\'' + t.id + '\')">作废 Token</button>' : ''}
          ${t.status === 'UNUSED' ? '<button class="btn btn-primary btn-sm" onclick="doReissueToken(\'' + t.id + '\')">补发 Token</button>' : ''}
        </div>
      </div>
    </div>
  `;
}

async function doVoidToken(tid) {
  const reason = prompt('请输入作废原因：');
  if (!reason) return;
  const resp = await fetch('/api/tokens/' + encodeURIComponent(tid) + '/void', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({reason: reason})
  });
  if (!resp.ok) { showToast('作废失败'); return; }
  showToast('Token 已作废');
  selectToken(tid);
}

async function doReissueToken(tid) {
  if (!confirm('确定要补发此 Token 吗？原 Token 将被标记为已作废。')) return;
  const resp = await fetch('/api/tokens/' + encodeURIComponent(tid) + '/reissue', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({reason: '手动补发'})
  });
  if (!resp.ok) { const err = await resp.json(); showToast('补发失败: ' + (err.detail || '')); return; }
  const data = await resp.json();
  showToast('新 Token 已生成: ' + data.token);
  selectedTokenId = null;
  loadTokens();
}

// ---- 告警中心 ----
let selectedAlertId = null;

async function loadAlerts() {
  var statsResp = await fetch('/api/alerts/stats');
  var stats = await statsResp.json();
  var alertsResp = await fetch('/api/alerts');
  var alerts = await alertsResp.json();

  var container = document.getElementById('customerItems');
  document.querySelector('.sidebar-header h3').textContent = '告警列表';
  document.querySelector('.sidebar-header h3').onclick = null;
  document.getElementById('customerCount').textContent = alerts.length;

  var keygenSection = document.querySelector('.keygen-section');
  if (keygenSection) {
    keygenSection.innerHTML = `
      <div class="keygen-title">告警统计</div>
      <div style="padding:8px 12px;font-size:12px;color:#475569;line-height:1.6;">
        <div>总数: <strong style="color:#dc2626;">${stats.total}</strong> · 今日: <strong>${stats.today}</strong></div>
        <div>待处理: <strong style="color:#f59e0b;">${stats.pending}</strong> · 已关闭: <strong>${stats.closed}</strong></div>
      </div>
      <button class="keygen-btn" style="margin-top:6px;" onclick="loadAlerts()">刷新</button>
    `;
  }

  var LEVEL_COLOR = {'P0':'#dc2626','P1':'#f59e0b','P2':'#3b82f6'};
  var STATUS_ICON = {'pending':'⚪','claimed':'🟡','processing':'🔵','closed':'🟢'};

  container.innerHTML = alerts.map(function(a) {
    return '<div class="customer-item ' + (a.id === selectedAlertId ? 'active' : '') + '" onclick="selectAlert(\'' + a.id + '\')">' +
      '<div class="name">' + (STATUS_ICON[a.status]||'⚪') + ' ' +
      '<span style="color:' + (LEVEL_COLOR[a.level]||'#64748b') + ';font-weight:600;">[' + a.level + ']</span> ' +
      escapeHtml(a.title) + '</div>' +
      '<div class="meta">' + (a.triggered_at||'') + ' · ' + (a.status||'?') + '</div></div>';
  }).join('');

  if (!selectedAlertId) {
    document.getElementById('detailPanel').innerHTML = '<div class="empty-state"><div class="icon">🚨</div><p>选择左侧告警查看详情</p></div>';
  }
}

async function selectAlert(aid) {
  selectedAlertId = aid;
  document.querySelectorAll('.nav-tab').forEach(function(el) { el.classList.toggle('active', el.dataset.tab === 'alerts'); });
  document.querySelector('.main-layout').classList.remove('sidebar-hidden');
  await loadAlerts();

  var resp = await fetch('/api/alerts/' + encodeURIComponent(aid));
  var a = await resp.json();

  var LEVEL_COLOR = {'P0':'#dc2626','P1':'#f59e0b','P2':'#3b82f6'};
  var STATUS_LABEL = {'pending':'待处理','claimed':'已认领','processing':'处理中','closed':'已关闭'};

  var logsHtml = (a.logs || []).map(function(l) {
    return '<div style="font-size:12px;padding:4px 0;border-bottom:1px solid #f1f5f9;">' +
      '<span style="color:#64748b;">' + (l.created_at||'') + '</span> ' +
      '<strong>' + l.action + '</strong>' +
      (l.operator ? ' by ' + l.operator : '') +
      (l.note ? ' — ' + l.note : '') + '</div>';
  }).join('');

  document.getElementById('detailPanel').innerHTML = `
    <div class="detail-card">
      <div class="detail-header">
        <div class="detail-avatar" style="background:${LEVEL_COLOR[a.level]||'#64748b'};">${a.level}</div>
        <div>
          <h2>${escapeHtml(a.title)}</h2>
          <span class="status-badge" style="background:${LEVEL_COLOR[a.level]||'#64748b'};color:#fff;">${a.level} · ${STATUS_LABEL[a.status]||a.status}</span>
        </div>
      </div>
      <div class="detail-body">
        ${a.detail ? '<div class="detail-row"><span class="label">详情</span><span class="value">' + escapeHtml(a.detail) + '</span></div>' : ''}
        <div class="detail-row"><span class="label">规则编码</span><span class="value">${a.rule_code||'—'}</span></div>
        <div class="detail-row"><span class="label">触发时间</span><span class="value">${a.triggered_at||'—'}</span></div>
        ${a.claimed_by ? '<div class="detail-row"><span class="label">认领人</span><span class="value">' + escapeHtml(a.claimed_by) + ' at ' + (a.claimed_at||'—') + '</span></div>' : ''}
        ${a.resolution_note ? '<div class="detail-row"><span class="label">解决备注</span><span class="value">' + escapeHtml(a.resolution_note) + '</span></div>' : ''}
        ${a.contract_id ? '<div class="detail-row"><span class="label">关联合同</span><span class="value">' + a.contract_id + '</span></div>' : ''}
        ${a.customer_id ? '<div class="detail-row"><span class="label">关联客户</span><span class="value">' + a.customer_id + '</span></div>' : ''}
      </div>
      <div class="detail-section">
        <h4>操作</h4>
        <div class="btn-group">
          ${a.status === 'pending' ? '<button class="btn btn-primary btn-sm" onclick="claimAlert(\'' + a.id + '\')">认领告警</button>' : ''}
          ${(a.status === 'claimed' || a.status === 'processing') ? '<button class="btn btn-success btn-sm" onclick="resolveAlert(\'' + a.id + '\')">标记解决</button>' : ''}
          ${a.status !== 'closed' ? '<button class="btn btn-warning btn-sm" onclick="escalateAlert(\'' + a.id + '\')">升级</button>' : ''}
        </div>
      </div>
      <div class="detail-section">
        <h4>操作日志</h4>
        ${logsHtml || '<p style="color:#94a3b8;font-size:12px;">暂无日志</p>'}
      </div>
    </div>
  `;
}

async function claimAlert(aid) {
  var resp = await fetch('/api/alerts/' + encodeURIComponent(aid) + '/claim', {method:'POST'});
  if (!resp.ok) { showToast('认领失败'); return; }
  showToast('告警已认领'); selectAlert(aid);
}

async function resolveAlert(aid) {
  var note = prompt('解决备注（可选）：');
  var resp = await fetch('/api/alerts/' + encodeURIComponent(aid) + '/resolve', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({note: note||''})
  });
  if (!resp.ok) { showToast('操作失败'); return; }
  showToast('告警已关闭'); selectAlert(aid);
}

async function escalateAlert(aid) {
  if (!confirm('确定升级此告警吗？')) return;
  var resp = await fetch('/api/alerts/' + encodeURIComponent(aid) + '/escalate', {method:'POST'});
  if (!resp.ok) { showToast('升级失败'); return; }
  showToast('告警已升级'); selectAlert(aid);
}
</script>
{% endblock %}

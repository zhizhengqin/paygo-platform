{% extends "base.html" %}
{% block content %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<div class="main-layout">
  <!-- 左侧面板 -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h3 onclick="showDashboard()" style="cursor:pointer;">客户列表</h3>
      <span class="badge" id="customerCount">0</span>
      <button class="btn btn-primary btn-sm" onclick="showAddCustomerModal()">+ 新增</button>
    </div>
    <div class="customer-list" id="customerItems"></div>

    <!-- 密钥生成器 -->
    <div class="keygen-section">
      <div class="keygen-title">密钥生成器</div>
      <button class="keygen-btn" onclick="generateKeys()">生成 5 个设备密钥</button>
      <div class="keygen-list" id="keygenList"></div>
    </div>
  </aside>

  <!-- 右侧详情面板 -->
  <main class="detail-panel" id="detailPanel">
    <div class="empty-state">
      <div class="icon">☀</div>
      <p>选择左侧客户查看详情</p>
    </div>
  </main>
</div>

<!-- 新增客户弹窗 -->
<div class="modal-overlay" id="addCustomerModal">
  <div class="modal-card">
    <h3>新增客户</h3>
    <div class="form-group">
      <label>姓名</label>
      <input type="text" id="newName" placeholder="客户姓名">
    </div>
    <div class="form-group">
      <label>电话</label>
      <input type="text" id="newPhone" placeholder="联系电话">
    </div>
    <div class="form-group">
      <label>设备编号</label>
      <input type="text" id="newDevice" placeholder="如 SN-KH-001">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>设备密钥（32位hex）</label>
        <input type="text" id="newSecretKey" placeholder="设备出厂预设的32位hex密钥">
      </div>
      <button class="btn btn-outline btn-sm" onclick="fillRandomKey()" title="随机生成密钥">随机</button>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('addCustomerModal')">取消</button>
      <button class="btn btn-primary" onclick="createCustomer()">确认添加</button>
    </div>
  </div>
</div>

<!-- 模拟支付弹窗 -->
<div class="modal-overlay" id="simulatePaymentModal">
  <div class="modal-card">
    <h3>模拟支付</h3>
    <p style="color:#64748b;font-size:13px;margin-bottom:16px;text-align:center;" id="simulateCustomerName"></p>
    <div class="form-group">
      <label>支付金额</label>
      <select id="paymentAmount" style="width:100%;padding:10px 14px;border:1.5px solid #e2e8f0;border-radius:6px;font-size:14px;font-family:inherit;">
        <option value="5">$5.00 — 30天</option>
        <option value="10">$10.00 — 60天</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('simulatePaymentModal')">取消</button>
      <button class="btn btn-primary" onclick="simulatePayment()">确认支付</button>
    </div>
  </div>
</div>

<!-- Token + SMS 结果弹窗 -->
<div class="modal-overlay" id="tokenResultModal">
  <div class="modal-card" style="max-width:440px;">
    <h3 id="tokenResultTitle">激活码已生成</h3>
    <div class="token-display" id="tokenCode"></div>
    <div class="sms-preview">
      <div class="sms-label">模拟短信发送</div>
      <div style="font-size:12px;color:#475569;margin-bottom:6px;">收件人: <strong id="smsTo"></strong></div>
      <div class="sms-content" id="smsBody"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="closeModal('tokenResultModal');selectCustomer(selectedCustomerId);">完成</button>
    </div>
  </div>
</div>

<!-- 确认弹窗 -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal-card">
    <h3 id="confirmTitle">确认操作</h3>
    <p style="color:#64748b;font-size:14px;margin-bottom:20px;text-align:center;" id="confirmMessage"></p>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('confirmModal')">取消</button>
      <button class="btn btn-danger" id="confirmBtn" onclick="">确认</button>
    </div>
  </div>
</div>

<!-- 删除确认弹窗 -->
<div class="modal-overlay" id="deleteConfirmModal">
  <div class="modal-card">
    <h3>确认删除</h3>
    <p style="color:#64748b;font-size:14px;margin-bottom:20px;text-align:center;">
      确定要删除客户 <strong id="deleteCustomerName"></strong> 吗？此操作不可撤销。
    </p>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('deleteConfirmModal')">取消</button>
      <button class="btn btn-danger" onclick="confirmDelete()">确认删除</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ---- Tab 切换 ----
function switchTab(tab) {
  document.querySelectorAll('.nav-tab').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === tab);
  });
  const layout = document.querySelector('.main-layout');
  if (tab === 'dashboard') {
    layout.classList.add('sidebar-hidden');
    showDashboard();
  } else if (tab === 'customers') {
    layout.classList.remove('sidebar-hidden');
    selectedCustomerId = null;
    // 还原侧边栏为客户列表模式
    document.querySelector('.sidebar-header h3').textContent = '客户列表';
    document.querySelector('.sidebar-header h3').onclick = function() { showDashboard(); };
    const keygenSection = document.querySelector('.keygen-section');
    if (keygenSection) {
      keygenSection.innerHTML = `
        <div class="keygen-title">密钥生成器</div>
        <button class="keygen-btn" onclick="generateKeys()">生成 5 个设备密钥</button>
        <div class="keygen-list" id="keygenList"></div>
      `;
    }
    loadCustomers();
    document.getElementById('detailPanel').innerHTML = `
      <div class="empty-state">
        <div class="icon">☀</div>
        <p>选择左侧客户查看详情</p>
      </div>
    `;
  } else if (tab === 'contracts') {
    layout.classList.remove('sidebar-hidden');
    selectedCustomerId = null;
    selectedContractId = null;
    loadContracts();
  }
}

let selectedCustomerId = null;
let deleteTargetId = null;

const STATUS_MAP = {
  active: '活跃',
  locked: '已锁定',
  permanent: '永久解锁',
};
const STATUS_CLASS = {
  active: 'status-active',
  locked: 'status-locked',
  permanent: 'status-permanent',
};
const STATUS_DOT = {
  active: '🟢',
  locked: '🔴',
  permanent: '⭐',
};

// ---- Toast ----
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ---- 密钥生成 ----
async function generateKeys() {
  const resp = await fetch('/api/utils/generate-secret-keys?count=5');
  const data = await resp.json();
  const list = document.getElementById('keygenList');
  list.innerHTML = data.secret_keys.map((k, i) => `
    <div class="keygen-item">
      <span>${i+1}. ${k}</span>
      <button class="keygen-copy" onclick="copyKey('${k}', this)">复制</button>
    </div>
  `).join('');
}

async function fillRandomKey() {
  const resp = await fetch('/api/utils/generate-secret-key');
  const data = await resp.json();
  document.getElementById('newSecretKey').value = data.secret_key;
}

function copyKey(key, btn) {
  navigator.clipboard.writeText(key).then(() => {
    btn.textContent = '已复制';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 1500);
  }).catch(() => { showToast('复制失败，请手动选择'); });
}

// ---- 仪表盘首页 ----
async function showDashboard() {
  selectedCustomerId = null;
  await loadCustomers();
  try {
    const resp = await fetch('/api/dashboard/stats');
    if (!resp.ok) throw new Error(resp.statusText);
    const stats = await resp.json();

  document.getElementById('detailPanel').innerHTML = `
    <div id="dashboardHome">
      <div class="dash-header">
        <h2>运营仪表盘</h2>
        <span class="dash-date" id="dashDate"></span>
      </div>

      <div class="kpi-grid">
        <div class="kpi-card kpi-blue">
          <div class="kpi-value">${stats.total_customers}</div>
          <div class="kpi-label">总客户数</div>
        </div>
        <div class="kpi-card kpi-green">
          <div class="kpi-value">${stats.active_devices}</div>
          <div class="kpi-label">活跃设备</div>
        </div>
        <div class="kpi-card kpi-gold">
          <div class="kpi-value">$${stats.monthly_revenue.toFixed(2)}</div>
          <div class="kpi-label">本月收入 (USD)</div>
        </div>
        <div class="kpi-card kpi-red">
          <div class="kpi-value">${stats.locked_devices}</div>
          <div class="kpi-label">逾期锁定</div>
        </div>
      </div>

      <div class="dash-grid">
        <div class="dash-chart-box">
          <h4>设备状态分布</h4>
          <div class="chart-wrap"><canvas id="statusChart"></canvas></div>
        </div>
        <div class="dash-table-box">
          <h4>最近交易</h4>
          <table class="tx-table" id="txTable">
            <thead><tr><th>时间</th><th>客户</th><th>金额</th><th>天数</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  `;

  document.getElementById('dashDate').textContent =
    new Date().toLocaleDateString('zh-CN', {year:'numeric',month:'long',day:'numeric'});

  renderStatusChart(stats);
  renderTxTable(stats.recent_transactions);
  } catch (e) {
    document.getElementById('detailPanel').innerHTML = `
      <div class="empty-state"><p>加载仪表盘失败，请刷新重试</p></div>`;
  }
}

function renderStatusChart(stats) {
  const data = [stats.active_devices, stats.locked_devices, stats.permanent_devices];
  if (data.every(d => d === 0)) {
    document.querySelector('.chart-wrap').innerHTML = '<p style="text-align:center;color:#94a3b8;padding:60px 0;">暂无设备数据</p>';
    return;
  }
  const ctx = document.getElementById('statusChart').getContext('2d');
  new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: ['活跃', '已锁定', '永久解锁'],
      datasets: [{
        data: data,
        backgroundColor: ['#059669', '#dc2626', '#f59e0b'],
        borderWidth: 0
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: 'bottom',
          labels: { padding: 16, usePointStyle: true, pointStyleWidth: 10 }
        }
      }
    }
  });
}

function renderTxTable(transactions) {
  const tbody = document.querySelector('#txTable tbody');
  if (!transactions || transactions.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#94a3b8;padding:24px;">暂无交易记录</td></tr>';
    return;
  }
  tbody.innerHTML = transactions.map(t => `
    <tr>
      <td>${t.generated_at || '-'}</td>
      <td>${escapeHtml(t.customer_name)}</td>
      <td>$${t.amount.toFixed(2)}</td>
      <td>${t.days === -1 ? '永久' : t.days + '天'}</td>
    </tr>
  `).join('');
}

// ---- 客户列表 ----
async function loadCustomers() {
  const resp = await fetch('/api/customers');
  const customers = await resp.json();
  const container = document.getElementById('customerItems');
  document.getElementById('customerCount').textContent = customers.length;
  if (customers.length === 0) {
    container.innerHTML = '<p style="color:#94a3b8;font-size:13px;text-align:center;padding:20px;">暂无客户</p>';
    return;
  }
  container.innerHTML = customers.map(c => `
    <div class="customer-item ${c.id === selectedCustomerId ? 'active' : ''}"
         onclick="selectCustomer('${c.id}')">
      <div class="name">${STATUS_DOT[c.status] || '⚪'} ${escapeHtml(c.name)}</div>
      <div class="meta">${c.phone} · ${c.device_id}</div>
    </div>
  `).join('');
}

// ---- 客户详情 ----
async function selectCustomer(id) {
  selectedCustomerId = id;
  document.querySelectorAll('.nav-tab').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === 'customers');
  });
  document.querySelector('.main-layout').classList.remove('sidebar-hidden');
  await loadCustomers();
  const resp = await fetch(`/api/customers/${id}`);
  const c = await resp.json();

  const smsResp = await fetch('/api/sms?customer_id=' + encodeURIComponent(id));
  const smsRecords = await smsResp.json();

  const initials = c.name.charAt(0);
  const statusLabel = STATUS_MAP[c.status] || c.status;
  const statusClass = STATUS_CLASS[c.status] || '';
  const statusDot = STATUS_DOT[c.status] || '';

  document.getElementById('detailPanel').innerHTML = `
    <div class="detail-card">
      <div class="detail-header">
        <div class="detail-avatar">${initials}</div>
        <div>
          <h2>${escapeHtml(c.name)}</h2>
          <span class="status-badge ${statusClass}">${statusDot} ${statusLabel}</span>
        </div>
      </div>

      <div class="detail-body">
        <div class="detail-row"><span class="label">电话</span><span class="value">${c.phone}</span></div>
        <div class="detail-row"><span class="label">设备编号</span><span class="value">${c.device_id}</span></div>
        <div class="detail-row"><span class="label">设备密钥</span><span class="value-mono">${c.secret_key.substring(0,12)}…</span></div>
        <div class="detail-row"><span class="label">Token 计数</span><span class="value">${c.count}</span></div>
        <div class="detail-row"><span class="label">创建日期</span><span class="value">${c.created_at}</span></div>
      </div>

      <div class="detail-section">
        <h4>模拟支付</h4>
        <p style="color:#94a3b8;font-size:12px;margin-bottom:10px;">模拟客户通过 Bakong 完成还款</p>
        <button class="btn btn-primary" onclick="showSimulatePaymentModal('${c.id}', '${escapeHtml(c.name).replace(/'/g, "\\'")}')">模拟支付</button>
      </div>

      <div class="detail-body">
        <div class="action-group">
          <button class="btn btn-danger" onclick="showLockConfirm('${c.id}', '${escapeHtml(c.name).replace(/'/g, "\\'")}')">锁定设备</button>
          <button class="btn btn-warning" onclick="showPermanentUnlockConfirm('${c.id}', '${escapeHtml(c.name).replace(/'/g, "\\'")}')">永久解锁</button>
          <button class="btn btn-outline" style="color:#dc2626;" onclick="showDeleteModal('${c.id}', '${escapeHtml(c.name).replace(/'/g, "\\'")}')">删除客户</button>
        </div>
      </div>

      <div class="sms-log" style="padding:0 24px 20px;">
        <h4>短信记录</h4>
        ${smsRecords.length === 0
          ? '<p style="color:#94a3b8;font-size:12px;">暂无记录</p>'
          : smsRecords.map(r => `
            <div class="sms-entry">
              <div class="sms-meta">收件人: ${r.to} · ${r.sent_at}</div>
              <div class="sms-text">${r.message}</div>
            </div>
          `).join('')
        }
      </div>
    </div>
  `;
}

// ---- 新增客户 ----
function showAddCustomerModal() {
  document.getElementById('newName').value = '';
  document.getElementById('newPhone').value = '';
  document.getElementById('newDevice').value = '';
  document.getElementById('newSecretKey').value = '';
  document.getElementById('addCustomerModal').classList.add('show');
}

async function createCustomer() {
  const name = document.getElementById('newName').value.trim();
  const phone = document.getElementById('newPhone').value.trim();
  const device_id = document.getElementById('newDevice').value.trim();
  const secret_key = document.getElementById('newSecretKey').value.trim();
  if (!name || !phone || !device_id || !secret_key) { alert('请填写所有字段'); return; }
  if (secret_key.length !== 32) { alert('设备密钥必须为32位hex字符串'); return; }
  const resp = await fetch('/api/customers', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name, phone, device_id, secret_key})
  });
  if (!resp.ok) {
    const err = await resp.json();
    alert('创建失败: ' + (err.detail || resp.statusText));
    return;
  }
  closeModal('addCustomerModal');
  await loadCustomers();
}

// ---- 模拟支付 ----
let simulateCustomerId = null;
function showSimulatePaymentModal(cid, name) {
  simulateCustomerId = cid;
  document.getElementById('simulateCustomerName').textContent = '为客户 ' + name + ' 模拟一笔支付';
  document.getElementById('simulatePaymentModal').classList.add('show');
}

async function simulatePayment() {
  const amount = parseFloat(document.getElementById('paymentAmount').value);
  const resp = await fetch(`/api/customers/${simulateCustomerId}/simulate-payment`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({amount})
  });
  const data = await resp.json();
  closeModal('simulatePaymentModal');

  const token = data.token;
  document.getElementById('tokenResultTitle').textContent = data.days === -1 ? '永久解锁码已生成' : '激活码已生成';
  document.getElementById('tokenCode').textContent = token;
  document.getElementById('smsTo').textContent = data.sms.to;
  document.getElementById('smsBody').textContent = data.sms.message;
  document.getElementById('tokenResultModal').classList.add('show');
}

// ---- 锁定设备 ----
function showLockConfirm(cid, name) {
  document.getElementById('confirmTitle').textContent = '锁定设备';
  document.getElementById('confirmMessage').textContent = '确定要锁定客户 ' + name + ' 的设备吗？锁定后设备将停止供电。';
  document.getElementById('confirmBtn').onclick = async function() {
    await fetch(`/api/customers/${cid}/lock`, {method: 'POST'});
    closeModal('confirmModal');
    selectCustomer(cid);
  };
  document.getElementById('confirmModal').classList.add('show');
}

// ---- 永久解锁 ----
function showPermanentUnlockConfirm(cid, name) {
  document.getElementById('confirmTitle').textContent = '永久解锁';
  document.getElementById('confirmMessage').textContent = '确定要为 ' + name + ' 生成永久解锁 Token 吗？此操作不可撤销。';
  document.getElementById('confirmBtn').onclick = async function() {
    const resp = await fetch(`/api/customers/${cid}/permanent-unlock`, {method: 'POST'});
    const data = await resp.json();
    closeModal('confirmModal');

    const token = data.token;
    document.getElementById('tokenResultTitle').textContent = '永久解锁码已生成';
    document.getElementById('tokenCode').textContent = token;
    document.getElementById('smsTo').textContent = data.sms.to;
    document.getElementById('smsBody').textContent = data.sms.message;
    document.getElementById('tokenResultModal').classList.add('show');
  };
  document.getElementById('confirmModal').classList.add('show');
}

// ---- 删除客户 ----
function showDeleteModal(cid, name) {
  deleteTargetId = cid;
  document.getElementById('deleteCustomerName').textContent = name;
  document.getElementById('deleteConfirmModal').classList.add('show');
}

async function confirmDelete() {
  await fetch(`/api/customers/${deleteTargetId}`, {method: 'DELETE'});
  closeModal('deleteConfirmModal');
  selectedCustomerId = null;
  document.getElementById('detailPanel').innerHTML = `
    <div class="empty-state"><div class="icon">☀</div><p>选择左侧客户查看详情</p></div>
  `;
  await loadCustomers();
}

// ---- 通用 ----
function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}

showDashboard();
document.querySelector('.main-layout').classList.add('sidebar-hidden');

// ---- 合同管理 ----
let selectedContractId = null;

async function loadContracts() {
  const resp = await fetch('/api/contracts');
  const contracts = await resp.json();
  const container = document.getElementById('customerItems');
  document.querySelector('.sidebar-header h3').textContent = '合同列表';
  document.querySelector('.sidebar-header h3').onclick = null;
  document.getElementById('customerCount').textContent = contracts.length;

  const STATUS_DOT_C = { draft:'📝', approved:'🔵', active:'🟢', overdue:'🟡', closed:'✅', recovered:'🔴' };

  container.innerHTML = contracts.map(c => `
    <div class="customer-item ${c.id === selectedContractId ? 'active' : ''}"
         onclick="selectContract('${c.id}')">
      <div class="name">${STATUS_DOT_C[c.status] || '⚪'} ${c.contract_no}</div>
      <div class="meta">${escapeHtml(c.customer_name || '—')} · ${c.status}</div>
    </div>
  `).join('');

  const keygenSection = document.querySelector('.keygen-section');
  if (keygenSection) {
    keygenSection.innerHTML = `
      <div class="keygen-title">贷款产品</div>
      <button class="keygen-btn" onclick="showLoanProductModal()">⚙ 贷款产品配置</button>
      <button class="keygen-btn" style="margin-top:6px;" onclick="showNewContractModal()">+ 新合同</button>
    `;
  }

  if (!selectedContractId) {
    document.getElementById('detailPanel').innerHTML = `
      <div class="empty-state">
        <div class="icon">📋</div>
        <p>选择左侧合同查看详情</p>
      </div>
    `;
  }
}

async function selectContract(cid) {
  selectedContractId = cid;
  await loadContracts();
  const resp = await fetch('/api/contracts/' + encodeURIComponent(cid));
  const c = await resp.json();

  const STATUS_LABEL = {
    draft: '草稿', approved: '已审批', active: '执行中',
    overdue: '逾期', closed: '已结清', recovered: '已回收',
  };

  document.getElementById('detailPanel').innerHTML = `
    <div class="detail-card">
      <div class="detail-header">
        <div class="detail-avatar">${c.contract_no ? c.contract_no[3] : 'C'}</div>
        <div>
          <h2>${escapeHtml(c.contract_no)}</h2>
          <span class="status-badge">${STATUS_LABEL[c.status] || c.status}</span>
        </div>
      </div>
      <div class="detail-body">
        <div class="detail-row"><span class="label">客户</span><span class="value">${escapeHtml(c.customer_name || '—')}</span></div>
        <div class="detail-row"><span class="label">贷款金额</span><span class="value">$${c.loan_amount.toFixed(2)}</span></div>
        <div class="detail-row"><span class="label">月供</span><span class="value">$${c.monthly_payment.toFixed(2)}</span></div>
        <div class="detail-row"><span class="label">首付</span><span class="value">$${c.down_payment.toFixed(2)}</span></div>
        <div class="detail-row"><span class="label">合同期限</span><span class="value">${c.start_date || '—'} ~ ${c.end_date || '—'}</span></div>
        <div class="detail-row"><span class="label">剩余天数</span><span class="value">${c.remaining_days || 0} 天</span></div>
      </div>
      <div class="detail-section">
        <h4>操作</h4>
        <div class="btn-group">
          ${c.status === 'draft' ? '<button class="btn btn-primary btn-sm" onclick="approveContract(\'' + c.id + '\')">审批通过</button>' : ''}
          ${c.status === 'active' ? '<button class="btn btn-warning btn-sm" onclick="markOverdue(\'' + c.id + '\')">标记逾期</button>' : ''}
          ${c.status === 'overdue' ? '<button class="btn btn-primary btn-sm" onclick="markActive(\'' + c.id + '\')">恢复活跃</button>' : ''}
          ${(c.status === 'active' || c.status === 'overdue') ? '<button class="btn btn-danger btn-sm" onclick="closeContract(\'' + c.id + '\')">结清/回收</button>' : ''}
        </div>
      </div>
      ${c.schedules && c.schedules.length > 0 ? `
      <div class="detail-section">
        <h4>还款计划表</h4>
        <div style="overflow-x:auto;">
          <table class="tx-table">
            <thead><tr><th>期数</th><th>应还日</th><th>月供</th><th>本金</th><th>利息</th><th>剩余本金</th><th>状态</th></tr></thead>
            <tbody>
              ${c.schedules.map(s => '<tr><td>' + s.period_no + '</td><td>' + s.due_date + '</td><td>$' + s.total.toFixed(2) + '</td><td>$' + s.principal.toFixed(2) + '</td><td>$' + s.interest.toFixed(2) + '</td><td>$' + s.balance.toFixed(2) + '</td><td>' + (s.status === 'paid' ? '✅' : s.status === 'overdue' ? '🔴' : '⏳') + '</td></tr>').join('')}
            </tbody>
          </table>
        </div>
      </div>
      ` : ''}
    </div>
  `;
}

async function approveContract(cid) {
  await fetch('/api/contracts/' + encodeURIComponent(cid) + '/approve', { method: 'PUT' });
  selectContract(cid);
  showToast('合同已审批通过，还款计划已生成');
}

async function markOverdue(cid) {
  await fetch('/api/contracts/' + encodeURIComponent(cid) + '/status', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({status: 'overdue'})
  });
  selectContract(cid);
  showToast('合同已标记为逾期');
}

async function markActive(cid) {
  await fetch('/api/contracts/' + encodeURIComponent(cid) + '/status', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({status: 'active'})
  });
  selectContract(cid);
  showToast('合同已恢复活跃');
}

async function closeContract(cid) {
  const status = confirm('选「确定」结清合同，选「取消」标记为设备回收') ? 'closed' : 'recovered';
  await fetch('/api/contracts/' + encodeURIComponent(cid) + '/status', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({status: status})
  });
  selectContract(cid);
  showToast(status === 'closed' ? '合同已结清' : '合同已标记为设备回收');
}

async function showNewContractModal() {
  const [customersResp, productsResp] = await Promise.all([
    fetch('/api/customers'), fetch('/api/loan-products')
  ]);
  const customers = await customersResp.json();
  const products = await productsResp.json();
  const activeProducts = products.filter(function(p) { return p.status === 'active'; });

  const customerOpts = customers.map(function(c) { return '<option value="' + c.id + '">' + escapeHtml(c.name) + ' (' + escapeHtml(c.device_id) + ')</option>'; }).join('');
  const productOpts = activeProducts.map(function(p) { return '<option value="' + p.id + '">' + p.name + ' — $' + p.total_amount.toFixed(0) + ' ' + p.term_months + '月 ' + p.interest_rate + '%</option>'; }).join('');

  document.getElementById('detailPanel').innerHTML = `
    <div class="detail-card" style="max-width:500px;">
      <h3 style="padding:20px 24px 0;">新合同</h3>
      <div class="detail-body">
        <div class="form-group">
          <label>客户</label>
          <select id="newContractCustomer" style="width:100%;height:38px;border:1px solid var(--border);border-radius:6px;padding:0 12px;font-family:inherit;">${customerOpts}</select>
        </div>
        <div class="form-group">
          <label>贷款产品</label>
          <select id="newContractProduct" style="width:100%;height:38px;border:1px solid var(--border);border-radius:6px;padding:0 12px;font-family:inherit;">${productOpts}</select>
        </div>
        <div class="modal-actions">
          <button class="btn btn-outline" onclick="loadContracts();">取消</button>
          <button class="btn btn-primary" onclick="createContract()">确认创建</button>
        </div>
      </div>
    </div>
  `;
}

async function createContract() {
  const customer_id = document.getElementById('newContractCustomer').value;
  const product_id = document.getElementById('newContractProduct').value;
  const resp = await fetch('/api/contracts', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({customer_id: customer_id, product_id: product_id})
  });
  if (!resp.ok) { const err = await resp.json(); alert('创建失败: ' + (err.detail || '')); return; }
  const c = await resp.json();
  showToast('合同 ' + c.contract_no + ' 已创建');
  selectContract(c.id);
}

async function showLoanProductModal() {
  const resp = await fetch('/api/loan-products');
  const products = await resp.json();

  document.getElementById('detailPanel').innerHTML = `
    <div class="detail-card" style="max-width:700px;">
      <h3 style="padding:20px 24px 0;">贷款产品配置</h3>
      <div class="detail-body">
        <table class="tx-table">
          <thead><tr><th>名称</th><th>kW</th><th>月数</th><th>利率</th><th>首付%</th><th>总价</th><th>状态</th></tr></thead>
          <tbody>
            ${products.map(function(p) { return '<tr><td>' + p.name + '</td><td>' + p.capacity_kw + '</td><td>' + p.term_months + '</td><td>' + p.interest_rate + '%</td><td>' + p.down_payment_pct + '%</td><td>$' + p.total_amount.toFixed(0) + '</td><td>' + (p.status === 'active' ? '🟢' : '⚫') + '</td></tr>'; }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}
</script>
{% endblock %}

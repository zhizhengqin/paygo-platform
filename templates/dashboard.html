{% extends "base.html" %}
{% block content %}
<div class="main-layout">
  <!-- 左侧面板 -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h3>客户列表</h3>
      <span class="badge" id="customerCount">0</span>
      <button class="btn btn-primary btn-sm" onclick="showAddCustomerModal()">+ 新增</button>
    </div>
    <div class="customer-list" id="customerItems"></div>

    <!-- 密钥生成器 -->
    <div class="keygen-section">
      <div class="keygen-title">密钥生成器</div>
      <button class="keygen-btn" onclick="generateKeys()">生成 5 个设备密钥</button>
      <div class="keygen-list" id="keygenList"></div>
    </div>
  </aside>

  <!-- 右侧详情面板 -->
  <main class="detail-panel" id="detailPanel">
    <div class="empty-state">
      <div class="icon">☀</div>
      <p>选择左侧客户查看详情</p>
    </div>
  </main>
</div>

<!-- 新增客户弹窗 -->
<div class="modal-overlay" id="addCustomerModal">
  <div class="modal-card">
    <h3>新增客户</h3>
    <div class="form-group">
      <label>姓名</label>
      <input type="text" id="newName" placeholder="客户姓名">
    </div>
    <div class="form-group">
      <label>电话</label>
      <input type="text" id="newPhone" placeholder="联系电话">
    </div>
    <div class="form-group">
      <label>设备编号</label>
      <input type="text" id="newDevice" placeholder="如 SN-KH-001">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>设备密钥（32位hex）</label>
        <input type="text" id="newSecretKey" placeholder="设备出厂预设的32位hex密钥">
      </div>
      <button class="btn btn-outline btn-sm" onclick="fillRandomKey()" title="随机生成密钥">随机</button>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('addCustomerModal')">取消</button>
      <button class="btn btn-primary" onclick="createCustomer()">确认添加</button>
    </div>
  </div>
</div>

<!-- 模拟支付弹窗 -->
<div class="modal-overlay" id="simulatePaymentModal">
  <div class="modal-card">
    <h3>模拟支付</h3>
    <p style="color:#64748b;font-size:13px;margin-bottom:16px;text-align:center;" id="simulateCustomerName"></p>
    <div class="form-group">
      <label>支付金额</label>
      <select id="paymentAmount" style="width:100%;padding:10px 14px;border:1.5px solid #e2e8f0;border-radius:6px;font-size:14px;font-family:inherit;">
        <option value="5">$5.00 — 30天</option>
        <option value="10">$10.00 — 60天</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('simulatePaymentModal')">取消</button>
      <button class="btn btn-primary" onclick="simulatePayment()">确认支付</button>
    </div>
  </div>
</div>

<!-- Token + SMS 结果弹窗 -->
<div class="modal-overlay" id="tokenResultModal">
  <div class="modal-card" style="max-width:440px;">
    <h3 id="tokenResultTitle">激活码已生成</h3>
    <div class="token-display" id="tokenCode"></div>
    <div class="sms-preview">
      <div class="sms-label">模拟短信发送</div>
      <div style="font-size:12px;color:#475569;margin-bottom:6px;">收件人: <strong id="smsTo"></strong></div>
      <div class="sms-content" id="smsBody"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="closeModal('tokenResultModal');selectCustomer(selectedCustomerId);">完成</button>
    </div>
  </div>
</div>

<!-- 确认弹窗 -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal-card">
    <h3 id="confirmTitle">确认操作</h3>
    <p style="color:#64748b;font-size:14px;margin-bottom:20px;text-align:center;" id="confirmMessage"></p>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('confirmModal')">取消</button>
      <button class="btn btn-danger" id="confirmBtn" onclick="">确认</button>
    </div>
  </div>
</div>

<!-- 删除确认弹窗 -->
<div class="modal-overlay" id="deleteConfirmModal">
  <div class="modal-card">
    <h3>确认删除</h3>
    <p style="color:#64748b;font-size:14px;margin-bottom:20px;text-align:center;">
      确定要删除客户 <strong id="deleteCustomerName"></strong> 吗？此操作不可撤销。
    </p>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('deleteConfirmModal')">取消</button>
      <button class="btn btn-danger" onclick="confirmDelete()">确认删除</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
let selectedCustomerId = null;
let deleteTargetId = null;

const STATUS_MAP = {
  active: '活跃',
  locked: '已锁定',
  permanent: '永久解锁',
};
const STATUS_CLASS = {
  active: 'status-active',
  locked: 'status-locked',
  permanent: 'status-permanent',
};
const STATUS_DOT = {
  active: '🟢',
  locked: '🔴',
  permanent: '⭐',
};

// ---- Toast ----
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ---- 密钥生成 ----
async function generateKeys() {
  const resp = await fetch('/api/utils/generate-secret-keys?count=5');
  const data = await resp.json();
  const list = document.getElementById('keygenList');
  list.innerHTML = data.secret_keys.map((k, i) => `
    <div class="keygen-item">
      <span>${i+1}. ${k}</span>
      <button class="keygen-copy" onclick="copyKey('${k}', this)">复制</button>
    </div>
  `).join('');
}

async function fillRandomKey() {
  const resp = await fetch('/api/utils/generate-secret-key');
  const data = await resp.json();
  document.getElementById('newSecretKey').value = data.secret_key;
}

function copyKey(key, btn) {
  navigator.clipboard.writeText(key).then(() => {
    btn.textContent = '已复制';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 1500);
  }).catch(() => { showToast('复制失败，请手动选择'); });
}

// ---- 客户列表 ----
async function loadCustomers() {
  const resp = await fetch('/api/customers');
  const customers = await resp.json();
  const container = document.getElementById('customerItems');
  document.getElementById('customerCount').textContent = customers.length;
  if (customers.length === 0) {
    container.innerHTML = '<p style="color:#94a3b8;font-size:13px;text-align:center;padding:20px;">暂无客户</p>';
    return;
  }
  container.innerHTML = customers.map(c => `
    <div class="customer-item ${c.id === selectedCustomerId ? 'active' : ''}"
         onclick="selectCustomer('${c.id}')">
      <div class="name">${STATUS_DOT[c.status] || '⚪'} ${c.name}</div>
      <div class="meta">${c.phone} · ${c.device_id}</div>
    </div>
  `).join('');
}

// ---- 客户详情 ----
async function selectCustomer(id) {
  selectedCustomerId = id;
  await loadCustomers();
  const resp = await fetch(`/api/customers/${id}`);
  const c = await resp.json();

  const smsResp = await fetch('/api/sms?customer_id=' + encodeURIComponent(id));
  const smsRecords = await smsResp.json();

  const initials = c.name.charAt(0);
  const statusLabel = STATUS_MAP[c.status] || c.status;
  const statusClass = STATUS_CLASS[c.status] || '';
  const statusDot = STATUS_DOT[c.status] || '';

  document.getElementById('detailPanel').innerHTML = `
    <div class="detail-card">
      <div class="detail-header">
        <div class="detail-avatar">${initials}</div>
        <div>
          <h2>${c.name}</h2>
          <span class="status-badge ${statusClass}">${statusDot} ${statusLabel}</span>
        </div>
      </div>

      <div class="detail-body">
        <div class="detail-row"><span class="label">电话</span><span class="value">${c.phone}</span></div>
        <div class="detail-row"><span class="label">设备编号</span><span class="value">${c.device_id}</span></div>
        <div class="detail-row"><span class="label">设备密钥</span><span class="value-mono">${c.secret_key.substring(0,12)}…</span></div>
        <div class="detail-row"><span class="label">Token 计数</span><span class="value">${c.count}</span></div>
        <div class="detail-row"><span class="label">创建日期</span><span class="value">${c.created_at}</span></div>
      </div>

      <div class="detail-section">
        <h4>模拟支付</h4>
        <p style="color:#94a3b8;font-size:12px;margin-bottom:10px;">模拟客户通过 Bakong 完成还款</p>
        <button class="btn btn-primary" onclick="showSimulatePaymentModal('${c.id}', '${c.name.replace(/'/g, "\\'")}')">模拟支付</button>
      </div>

      <div class="detail-body">
        <div class="action-group">
          <button class="btn btn-danger" onclick="showLockConfirm('${c.id}', '${c.name.replace(/'/g, "\\'")}')">锁定设备</button>
          <button class="btn btn-warning" onclick="showPermanentUnlockConfirm('${c.id}', '${c.name.replace(/'/g, "\\'")}')">永久解锁</button>
          <button class="btn btn-outline" style="color:#dc2626;" onclick="showDeleteModal('${c.id}', '${c.name.replace(/'/g, "\\'")}')">删除客户</button>
        </div>
      </div>

      <div class="sms-log" style="padding:0 24px 20px;">
        <h4>短信记录</h4>
        ${smsRecords.length === 0
          ? '<p style="color:#94a3b8;font-size:12px;">暂无记录</p>'
          : smsRecords.map(r => `
            <div class="sms-entry">
              <div class="sms-meta">收件人: ${r.to} · ${r.sent_at}</div>
              <div class="sms-text">${r.message}</div>
            </div>
          `).join('')
        }
      </div>
    </div>
  `;
}

// ---- 新增客户 ----
function showAddCustomerModal() {
  document.getElementById('newName').value = '';
  document.getElementById('newPhone').value = '';
  document.getElementById('newDevice').value = '';
  document.getElementById('newSecretKey').value = '';
  document.getElementById('addCustomerModal').classList.add('show');
}

async function createCustomer() {
  const name = document.getElementById('newName').value.trim();
  const phone = document.getElementById('newPhone').value.trim();
  const device_id = document.getElementById('newDevice').value.trim();
  const secret_key = document.getElementById('newSecretKey').value.trim();
  if (!name || !phone || !device_id || !secret_key) { alert('请填写所有字段'); return; }
  if (secret_key.length !== 32) { alert('设备密钥必须为32位hex字符串'); return; }
  const resp = await fetch('/api/customers', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name, phone, device_id, secret_key})
  });
  if (!resp.ok) {
    const err = await resp.json();
    alert('创建失败: ' + (err.detail || resp.statusText));
    return;
  }
  closeModal('addCustomerModal');
  await loadCustomers();
}

// ---- 模拟支付 ----
let simulateCustomerId = null;
function showSimulatePaymentModal(cid, name) {
  simulateCustomerId = cid;
  document.getElementById('simulateCustomerName').textContent = '为客户 ' + name + ' 模拟一笔支付';
  document.getElementById('simulatePaymentModal').classList.add('show');
}

async function simulatePayment() {
  const amount = parseFloat(document.getElementById('paymentAmount').value);
  const resp = await fetch(`/api/customers/${simulateCustomerId}/simulate-payment`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({amount})
  });
  const data = await resp.json();
  closeModal('simulatePaymentModal');

  const token = data.token;
  document.getElementById('tokenResultTitle').textContent = data.days === -1 ? '永久解锁码已生成' : '激活码已生成';
  document.getElementById('tokenCode').textContent = token;
  document.getElementById('smsTo').textContent = data.sms.to;
  document.getElementById('smsBody').textContent = data.sms.message;
  document.getElementById('tokenResultModal').classList.add('show');
}

// ---- 锁定设备 ----
function showLockConfirm(cid, name) {
  document.getElementById('confirmTitle').textContent = '锁定设备';
  document.getElementById('confirmMessage').textContent = '确定要锁定客户 ' + name + ' 的设备吗？锁定后设备将停止供电。';
  document.getElementById('confirmBtn').onclick = async function() {
    await fetch(`/api/customers/${cid}/lock`, {method: 'POST'});
    closeModal('confirmModal');
    selectCustomer(cid);
  };
  document.getElementById('confirmModal').classList.add('show');
}

// ---- 永久解锁 ----
function showPermanentUnlockConfirm(cid, name) {
  document.getElementById('confirmTitle').textContent = '永久解锁';
  document.getElementById('confirmMessage').textContent = '确定要为 ' + name + ' 生成永久解锁 Token 吗？此操作不可撤销。';
  document.getElementById('confirmBtn').onclick = async function() {
    const resp = await fetch(`/api/customers/${cid}/permanent-unlock`, {method: 'POST'});
    const data = await resp.json();
    closeModal('confirmModal');

    const token = data.token;
    document.getElementById('tokenResultTitle').textContent = '永久解锁码已生成';
    document.getElementById('tokenCode').textContent = token;
    document.getElementById('smsTo').textContent = data.sms.to;
    document.getElementById('smsBody').textContent = data.sms.message;
    document.getElementById('tokenResultModal').classList.add('show');
  };
  document.getElementById('confirmModal').classList.add('show');
}

// ---- 删除客户 ----
function showDeleteModal(cid, name) {
  deleteTargetId = cid;
  document.getElementById('deleteCustomerName').textContent = name;
  document.getElementById('deleteConfirmModal').classList.add('show');
}

async function confirmDelete() {
  await fetch(`/api/customers/${deleteTargetId}`, {method: 'DELETE'});
  closeModal('deleteConfirmModal');
  selectedCustomerId = null;
  document.getElementById('detailPanel').innerHTML = `
    <div class="empty-state"><div class="icon">☀</div><p>选择左侧客户查看详情</p></div>
  `;
  await loadCustomers();
}

// ---- 通用 ----
function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}

loadCustomers();
</script>
{% endblock %}

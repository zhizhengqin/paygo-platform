      - heading "3. 完整业务闭环走通验证清单" [level=2] [ref=e295]
      - text: 按以下顺序逐一操作，验证平台全部功能：
      - code [ref=e297]: □ 1. [仪表盘] 登录 → 首页 8 张 KPI 卡片正常显示 □ 2. [仪表盘] ECharts 图表渲染（收入/Token/告警/设备） □ 3. [仪表盘] 时间切换 7天/30天，数据刷新 □ 4. [客户管理] 新增客户（姓名+电话+设备编号+随机密钥） □ 5. [客户管理] 搜索框输入客户姓名 → 筛选正常 □ 6. [客户管理] 点击客户 → 360 视图正常展示 □ 7. [客户管理] 添加标签 "VIP" → 标签显示在详情和列表 □ 8. [客户管理] 模拟支付 $5 → Token 弹窗展示 □ 9. [合同管理] 切换 tab → 合同列表显示 □ 10. [合同管理] 查看贷款产品配置 → 5 档产品存在 □ 11. [合同管理] 创建合同（选客户+产品）→ 草稿状态 □ 12. [合同管理] 审批通过 → 还款计划表生成 □ 13. [合同管理] 模拟还款第1期 → Token 生成，进度条更新 □ 14. [合同管理] 点击检测逾期 → 逾期合同标记 □ 15. [合同管理] 提前结清 → DISABLE_PAYG Token 生成 □ 15a.[控制器] 打开 /controller → 选择设备 → 输入 Token → 验证成功 □ 15b.[控制器] 尝试输入已使用 Token → 防重放拒绝 □ 15c.[控制器] DISABLE_PAYG Token → 永久解锁提示 □ 16. [Token管理] 切换 tab → Token 列表显示 □ 17. [Token管理] 查看统计卡片（总数/今日/本月/已作废） □ 18. [Token管理] 点击 Token 查看详情 □ 19. [Token管理] 作废 Token → 输入原因 → 状态变化 □ 20. [Token管理] 补发 Token → 新 Token 生成 □ 21. [Token管理] 批量生成 → 生成成功 □ 22. [告警中心] 切换 tab → 告警列表显示（3 条种子规则） □ 23. [告警中心] 点击告警 → 详情 + 操作日志 □ 24. [告警中心] 认领 → 标记解决 → 升级 工作流正常 □ 25. [设备地图] 切换 tab → Leaflet 地图渲染 □ 26. [设备地图] 图层切换（全部/活跃/逾期/永久）正常 □ 27. [设备地图] 搜索设备序列号 → 自动定位 □ 28. [报表中心] 切换 tab → 报表汇总正常 □ 29. [报表中心] ESG 碳减排数据显示 □ 30. [报表中心] CSV 导出下载正常 □ 31. [系统设置] 切换 tab → 健康检查状态正常 □ 32. [系统设置] 新增 MFI 机构 □ 33. [系统设置] 新增用户 □ 34. [登录] 登出 → 重新登录 → session 正常 □ 35. [登录] 连续 5 次错误密码 → 账户锁定提示

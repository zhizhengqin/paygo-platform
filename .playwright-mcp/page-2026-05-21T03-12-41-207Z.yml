      - listitem [ref=e251]: 实际处理（电话联系客户等）
      - listitem [ref=e252]:
        - text: 点击「
        - strong [ref=e253]: 标记解决
        - text: 」→ 输入解决备注（如"已联系客户，承诺明日还款"）
      - listitem [ref=e254]: 告警状态变为「已关闭」
      - strong [ref=e255]: 升级告警：
      - listitem [ref=e256]:
        - text: 对于 P1 或 P2 告警，点击「
        - strong [ref=e257]: 升级
        - text: 」
      - listitem [ref=e258]: P2 → P1，P1 → P0
      - listitem [ref=e259]: 操作日志记录升级事件
      - strong [ref=e260]: 查看操作日志：
      - listitem [ref=e261]: 告警详情底部显示完整操作时间线：触发 → 认领 → 升级 → 解决
      - separator [ref=e262]

      - heading "6. 环境要求与安装" [level=2] [ref=e642]
      - listitem [ref=e643]: Python 3.10+
      - listitem [ref=e644]: PostgreSQL 15+
      - listitem [ref=e645]: Redis 8+
      - heading "数据库初始化（首次）" [level=3] [ref=e646]
      - code [ref=e648]: psql -U postgres -c "CREATE USER paygo_user WITH PASSWORD 'PaygoDB2026!';" psql -U postgres -c "CREATE DATABASE paygo_platform OWNER paygo_user;" psql -U postgres -c "CREATE DATABASE paygo_platform_test OWNER paygo_user;" psql -U postgres -d paygo_platform -c "GRANT ALL ON SCHEMA public TO paygo_user;" psql -U postgres -d paygo_platform_test -c "GRANT ALL ON SCHEMA public TO paygo_user;"
      - heading "Homebrew 安装（macOS）" [level=3] [ref=e649]
      - code [ref=e651]: brew install postgresql@15 redis brew services start postgresql@15 brew services start redis

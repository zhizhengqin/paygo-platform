      - heading "curl 示例" [level=3] [ref=e634]
      - code [ref=e636]:
        - text: "# 登录 curl -c cookies.txt -X POST \\ -d \"username=admin&password=admin123\" \\ http://localhost:8000/login"
        - heading "仪表盘增强统计" [level=1] [ref=e637]
        - text: curl -b cookies.txt http://localhost:8000/api/dashboard/enhanced-stats?days=30
        - heading "创建客户" [level=1] [ref=e638]
        - text: "curl -b cookies.txt -X POST -H \"Content-Type: application/json\" \\ -d '{\"name\":\"Test\",\"phone\":\"+855999\",\"device_id\":\"DEV-T1\",\"secret_key\":\"'$(python3 -c \"import secrets;print(secrets.token_hex(16))\")'\"}' \\ http://localhost:8000/api/customers"
        - heading "创建合同 → 审批 → 还款 → 结清" [level=1] [ref=e639]
        - text: "CUST_ID=\"Cxxxx\" PROD_ID=$(curl -b cookies.txt http://localhost:8000/api/loan-products | python3 -c \"import sys,json;print(json.load(sys.stdin)[0]['id'])\") CT_ID=$(curl -b cookies.txt -X POST -H \"Content-Type: application/json\" \\ -d \"{\\\"customer_id\\\":\\\"$CUST_ID\\\",\\\"product_id\\\":\\\"$PROD_ID\\\"}\" \\ http://localhost:8000/api/contracts | python3 -c \"import sys,json;print(json.load(sys.stdin)['id'])\") curl -b cookies.txt -X PUT http://localhost:8000/api/contracts/$CT_ID/approve"
        - heading "获取第一期 schedule_id 后还款" [level=1] [ref=e640]
        - text: "curl -b cookies.txt -X POST -H \"Content-Type: application/json\" \\ -d '{\"schedule_id\":\"RSxxxx\",\"amount\":43.31}' \\ http://localhost:8000/api/contracts/$CT_ID/pay"

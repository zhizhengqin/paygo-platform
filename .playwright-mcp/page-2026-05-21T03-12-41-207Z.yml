      - heading "8. 项目结构" [level=2] [ref=e658]
      - code [ref=e660]: "paygo-platform/ ├── app/ │ ├── main.py # FastAPI 入口（lifespan 管理 DB/Redis/中间件/迁移） │ ├── settings.py # 数据库/Redis/安全/JWT/限流 配置 │ ├── models.py # SQLAlchemy ORM（16 张表） │ ├── database.py # async engine + session 工厂 │ ├── redis.py # Redis session/缓存/防重放 │ ├── store.py # async 数据访问层（CRUD/还款/逾期/告警/标签/360） │ ├── security.py # bcrypt + Fernet + JWT │ ├── middleware.py # API 限流 + 请求日志 │ └── routers/ │ ├── auth.py # 登录/登出（bcrypt + JWT + session） │ ├── customers.py # 客户 CRUD + 模拟支付 + 锁定/解锁 + 设备地图 │ ├── contracts.py # 合同 + 贷款产品 + 还款/逾期/结清 │ ├── tokens.py # Token 管理（列表/详情/补发/作废/批量） │ ├── alerts.py # 告警中心（规则/列表/详情/认领/解决/升级） │ ├── dashboard.py # 仪表盘统计（基础 + 增强） │ ├── reports.py # 报表中心（汇总/ESG/CSV导出） │ ├── settings.py # 系统设置（健康检查/汇率/模板/用户） │ └── config.py # 支付汇率配置 ├── scripts/ │ └── seed_demo_data.py # 演示数据初始化脚本 ├── controller/ │ ├── controller.py # 终端 UI（Token 输入/密钥绑定） │ └── state_manager.py # 状态机 + PostgreSQL 持久化 ├── static/ │ ├── style.css # 全局样式（绿色主题 #059669） │ └── logo.png ├── templates/ │ ├── base.html # 布局框架（8 个导航 Tab） │ ├── login.html # 登录页 │ └── dashboard.html # 主界面 SPA（全部 8 个模块） └── tests/ # 200 个测试"
